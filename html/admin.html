<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Administración</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
    
    <nav class="navbar border-bottom shadow-sm">
        <div class="container-fluid d-flex justify-content-between align-items-center">
            
            <div class="nav-left">
                <div class="dropdown">
                    <button class="btn" id="btn-modo-oscuro">
                        <i class="bi bi-moon"></i>
                    </button>
                </div>
            </div>
            
            <div class="nav-center text-center">
                <span class="navbar-brand m-0 fw-bold text-uppercase">
                    <i class="bi bi-gear-fill me-2 text-primary"></i>Administración
                </span>
            </div>
            
            <div class="nav-right">
                <a href="index.html" class="btn btn-outline-primary btn-sm fw-bold">
                    <i class="bi bi-box-arrow-left me-2"></i>Volver
                </a>
            </div>
            
        </div>
    </nav>

    <div class="container mt-5 mb-5">
        <div class="row g-4">
            
            <div class="col-md-4">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-primary text-white fw-bold">
                        <i class="bi bi-tags-fill me-2"></i>Añadir Categoría
                    </div>
                    <div class="card-body">
                        <form id="form-categoria">
                            <div class="mb-3">
                                <label for="nombre-categoria" class="form-label fw-bold">Nombre de la Categoría</label>
                                <input type="text" class="form-control" id="nombre-categoria" placeholder="Ej: Zapatillas" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 fw-bold">Guardar Categoría</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-8">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-success text-white fw-bold">
                        <i class="bi bi-box-seam-fill me-2"></i>Añadir Nuevo Producto
                    </div>
                    <div class="card-body">
                        <form id="form-producto">
                            <div class="row g-3">
                                
                                <div class="col-md-6">
                                    <label for="prod-nombre" class="form-label fw-bold">Nombre del Producto</label>
                                    <input type="text" class="form-control" id="prod-nombre" placeholder="Ej: Silla de oficina" required>
                                </div>
                                
                                <div class="col-md-6">
                                    <label for="prod-codigo" class="form-label fw-bold">Código Único</label>
                                    <input type="text" class="form-control" id="prod-codigo" placeholder="Ej: MUEB-001" required>
                                </div>
                                
                                <div class="col-md-12">
                                    <label for="prod-descripcion" class="form-label fw-bold">Descripción</label>
                                    <textarea class="form-control" id="prod-descripcion" rows="2" placeholder="Detalles del producto..." required></textarea>
                                </div>
                                
                                <div class="col-md-4">
                                    <label for="prod-precio" class="form-label fw-bold">Precio (€)</label>
                                    <input type="number" step="0.01" min="0" class="form-control" id="prod-precio" placeholder="0.00" required>
                                </div>
                                
                                <div class="col-md-4">
                                    <label for="prod-stock" class="form-label fw-bold">Stock Inicial</label>
                                    <input type="number" min="1" class="form-control" id="prod-stock" placeholder="10" required>
                                </div>
                                
                                <div class="col-md-4">
                                    <label for="prod-categoria" class="form-label fw-bold">Categoría</label>
                                    <select class="form-select" id="prod-categoria" required>
                                        <option value="" selected disabled>Cargando categorías...</option>
                                    </select>
                                </div>
                                
                                <div class="col-md-12">
                                    <label for="prod-imagen" class="form-label fw-bold">Imagen del Producto</label>
                                    <input class="form-control" type="file" id="prod-imagen" accept="image/*" required>
                                    <div class="form-text">Formatos admitidos: JPG, PNG. La imagen se convertirá para almacenamiento local.</div>
                                </div>
                                
                            </div>
                            
                            <hr class="my-4">
                            <button type="submit" class="btn btn-success w-100 fw-bold fs-5">Guardar Producto</button>
                        </form>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="../frontend-js/interfaz.js"></script>
    <script src="../frontend-js/admin.js"></script>
</body>
</html>
