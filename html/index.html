<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi tienda</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
    <nav class="navbar navbar-light bg-light border-bottom">
        <div class="container-fluid d-flex justify-content-between align-items-center">
            <div class="nav-left">
                <button class="btn btn-light border-0" id="btn-categorias" title="Categorías">
                    <i class="bi bi-search"></i>
                </button>
            </div>
            <div class="nav-center">
                <a class="navbar-brand m-0 fw-bold text-uppercase" href="#">Mi tienda</a>
            </div>
            <div class="nav-right d-flex gap-2">
                <button class="btn btn-light position-relative">
                    <i class="bi bi-cart"></i>
                    <span id="contador-carrito" class="badge bg-danger rounded-pill position-absolute top-0 start-100 translate-middle" style="display:none;">0</span>
                </button>
                <button class="btn btn-light">
                    <i class="bi bi-person"></i>
                </button>
                <button class="btn btn-light">
                    <i class="bi bi-gear"></i>
                </button>
            </div>
        </div>
    </nav>
    <section class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8">
            
            <div class="input-group mb-3 shadow-sm">
                <input type="text" id="input-busqueda" class="form-control form-control-lg" placeholder="¿Qué producto buscas hoy?" aria-label="Buscador de productos">
                
                <button class="btn btn-primary px-4" type="button" id="btn-buscar">
                    <i class="bi bi-search me-2"></i>Buscar
                </button>
            </div>

        </div>
    </div>
</section>
<main class="container mt-5">
    <div class="row g-4" id="contenedor-productos">
        
        <div class="col-12 text-center text-muted py-5">
            <div class="spinner-border text-primary mb-3" role="status"></div>
            <p>Buscando los mejores productos para ti...</p>
        </div>

    </div>
    
</main>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script src="../frontend-js/main.js"></script>

</body>

</html>
