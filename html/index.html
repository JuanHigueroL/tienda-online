<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi tienda</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
    <nav class="navbar navbar-light border-bottom">
        <div class="container-fluid d-flex justify-content-between align-items-center">
            <div class="nav-left">
                <button class="btn border-0" type="button" data-bs-toggle="offcanvas" data-bs-target="#menuBuscador">
                    <i class="bi bi-search"></i>
                </button>
            </div>
            <div class="nav-center">
                <a class="navbar-brand m-0 fw-bold text-uppercase" href="#">Mi tienda</a>
            </div>
            <div class="nav-right d-flex gap-2">

                <div class="dropdown">
                    <button class="btn" id="btn-modo-oscuro">
                        <i class="bi bi-moon"></i>
                    </button>
                </div>

                <div class="dropdown">
                    <button class="btn" data-bs-toggle="dropdown">
                        <i class="bi bi-person"></i>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end shadow border-0">
                        <li><a class="dropdown-item" href="#"><i class="bi bi-door-open me-2"></i>Iniciar Sesión</a></li>
                        <li><a class="dropdown-item" href="#"><i class="bi bi-person-plus me-2"></i>Registrarse</a></li>
                    </ul>
                </div>

                <button class="btn position-relative" data-bs-toggle="offcanvas" data-bs-target="#menuCesta">
                    <i class="bi bi-cart"></i>
                <span id="contador-carrito" class="badge bg-danger rounded-pill position-absolute translate-middle" style="font-size: 0.75rem; padding: 0.25em 0.5em; top:22%; left: 80%">0</span>
                </button>
            </div>
        </div>
    </nav>
    <section class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8">
            
            <div class="input-group mb-3 shadow-sm">
                <input type="text" id="input-busqueda" class="form-control form-control-lg" placeholder="¿Qué producto buscas hoy?" aria-label="Buscador de productos">
                
                <button class="btn btn-primary px-4" type="button" id="btn-buscar">
                    <i class="bi bi-search me-2"></i>Buscar
                </button>
            </div>

        </div>
    </div>
</section>
<main class="container mt-5">
    <div class="row g-4" id="contenedor-productos">
        
        <div class="col-12 text-center text-muted py-5">
            <div class="spinner-border text-primary mb-3" role="status"></div>
            <p>Buscando los mejores productos para ti...</p>
        </div>

    </div>
    
</main>

<div class="offcanvas offcanvas-start" tabindex="-1" id="menuBuscador" aria-labelledby="labelBuscador">
    <div class="offcanvas-header border-bottom">
        <h5 class="offcanvas-title fw-bold" id="labelBuscador">FILTRAR POR CATEGORIAS</h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body">
        <div class="input-group mb-3">
            <input type="text" id="input-lateral" class="form-control" placeholder="Filtro de categorías">
        </div>
        <div class="seccion-filtros mb-4">
            <div class="form-check mb-2">
                <input class="form-check-input" type="radio" name="filtroEjemplo" id="filtroEjemplo" value="Ejemplo">
                <label class="form-check-label small" for="filtroEjemplo">Espera a que carguen las categorías</label>
            </div>
        </div>
    </div>
</div>

<div class="offcanvas offcanvas-end" tabindex="-1" id="menuCesta" aria-labelledby="labelCesta">
    <div class="offcanvas-header border-bottom">
        <h5 class="offcanvas-title fw-bold" id="labelCesta">CESTA DE LA COMPRA</h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body">
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script src="../frontend-js/main.js"></script>
<script src="../frontend-js/interfaz.js"></script>

</body>

</html>
